[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "yprov-ask"
version = "0.1.0"
description = "Ask questions in natural language about W3C PROV files (yProv4ML, yProv4Agents) through an MCP server backed by a LangGraph agent."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Munyaradzi Zhou", email = "munyaradzizhou11@gmail.com" }]
keywords = ["provenance", "w3c-prov", "mcp", "langgraph", "yprov", "llm", "grounding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
# Upper bounds are deliberate: mcp and langgraph both changed their APIs at a major version
# (mcp 2 renamed FastMCP to MCPServer), and this code is written against these majors.
dependencies = [
    "mcp>=2.3,<3",
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.7,<2",
    "truststore>=0.9,<0.12",
    "starlette>=0.40,<2",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<0.15",
    "pre-commit>=3.7,<5",
]

[project.urls]
Repository = "https://github.com/munyaradzi-zhou/yprov-ask"
Issues = "https://github.com/munyaradzi-zhou/yprov-ask/issues"

[project.scripts]
yprov-ask = "yprov_ask.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["yprov_ask"]

[tool.uv]
# The operating system's certificate store, for networks whose proxy re-signs TLS.
native-tls = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["llm: calls the OpenAI API; needs OPENAI_API_KEY and costs money"]
